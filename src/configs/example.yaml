server:
  bind: "127.0.0.1:41973"
  bind_addresses:
    - "127.0.0.1:41973"
  public_base_url: "http://127.0.0.1:41973"
  auth:
    mode: "static-token"

management:
  enabled: true
  bind: "127.0.0.1:41974"
  bind_addresses:
    - "127.0.0.1:41974"
  auth:
    mode: "admin-token"

index:
  data_dir: "data"
  # PostgreSQL is the default catalog backend. SQLite remains available for
  # compact portable deployments with driver: sqlite and an empty dsn.
  database:
    driver: "postgres"
    dsn: "postgres://qindexer:change-me@127.0.0.1:5432/qindexer?sslmode=disable"
    max_open_conns: 32
    max_idle_conns: 8
  commit_interval_seconds: 5
  max_results: 200

crawler:
  scan_interval_seconds: 300
  # Independent roots run concurrently. Per-root latency probes reduce this
  # configuration ceiling for slow NAS and VPN paths.
  root_parallelism: 3
  # High ceilings for a fast local root. QIndexer measures each root and caps
  # slower SMB/NAS roots below these values.
  directory_worker_count: 48
  metadata_worker_count: 32
  metadata_queue_size: 16384
  index_batch_size: 4096
  ignore_hidden: false
  follow_symlinks: false
  missing_after_successful_crawls: 3
  # Ownership metadata can require a separate security-descriptor round trip on NAS paths.
  collect_ownership: false
  content_extraction:
    enabled: false
    worker_count: 3
    queue_size: 1000
    max_file_size_mb: 64
    # Text is stored once and capped per document to keep SQLite predictable.
    max_stored_text_kb: 1024
  # OCR is local-only and opt-in. In auto mode, images use Tesseract and scanned
  # PDFs use OCRmyPDF. Install those commands separately or supply full paths.
  ocr:
    enabled: false
    engine: "auto"
    tesseract_command: "tesseract"
    ocrmypdf_command: "ocrmypdf"
    languages: "eng"
    worker_count: 2
    queue_size: 100
    max_file_size_mb: 128
    timeout_seconds: 180
  hashing:
    enabled: false
    worker_count: 3
    queue_size: 1000
    max_file_size_mb: 2048
  adaptive_throttle:
    enabled: true
    sample_interval_seconds: 5
    cpu_percent_threshold: 80
    disk_busy_percent_threshold: 70
    recovery_samples: 3

watcher:
  enabled: true
  debounce_milliseconds: 1500
  max_watched_directories: 25000
  max_dirty_paths_per_flush: 500
  activity_half_life_days: 60
  rebalance_minutes: 15

roots:
  - id: "local-sample"
    path: "."
    enabled: true
    labels: ["local"]
    include_extensions: []
    exclude_extensions: ["tmp", "bak"]
    include_file_patterns: []
    exclude_file_patterns:
      - "~$*"
      - "*.tmp"
      - "*.bak"
    include_folder_patterns: []
    exclude_folder_patterns:
      - "**/.git/**"
      - "**/node_modules/**"
      - "**/@Recently-Snapshot/**"
      - "**/@Recycle/**"
      - "**/#recycle/**"
      - "**/$RECYCLE.BIN/**"
      - "**/RECYCLER/**"
      - "**/.sync/**"
      - "**/.qsync/**"
      - "**/.qsync_sn/**"
    exclude_patterns: []
    path_aliases: []
    # Per-root enrichment switches override the crawler-wide legacy defaults.
    content_extraction: false
    ocr: false
    hashing: false
    collect_ownership: false
