server:
  bind: "127.0.0.1:41973"
  bind_addresses:
    - "127.0.0.1:41973"
    # Add a VPN or dedicated adapter address when QSurfer should query remotely.
    # - "10.8.0.2:41973"
  public_base_url: "http://127.0.0.1:41973"
  auth:
    mode: "static-token"
    token_file: "/etc/qsurfer-search/secrets/search-api-token"

management:
  enabled: true
  bind: "127.0.0.1:41974"
  bind_addresses:
    - "127.0.0.1:41974"
  auth:
    mode: "admin-token"
    token_file: "/etc/qsurfer-search/secrets/admin-api-token"

index:
  data_dir: "/var/lib/qsurfer-search"
  commit_interval_seconds: 5
  max_results: 200

crawler:
  scan_interval_seconds: 300
  root_parallelism: 1
  directory_worker_count: 2
  metadata_worker_count: 4
  metadata_queue_size: 5000
  index_batch_size: 1000
  ignore_hidden: false
  follow_symlinks: false
  missing_after_successful_crawls: 3

watcher:
  enabled: true
  debounce_milliseconds: 1500
  max_watched_directories: 25000
  max_dirty_paths_per_flush: 500

roots:
  - id: "nas-finance"
    path: "/mnt/nas-finance"
    path_aliases:
      - id: "finance-x-drive"
        platform: "windows-drive"
        path: "X:\\Finance"
        target: "/mnt/nas-finance"
      - id: "finance-unc"
        platform: "windows-unc"
        path: "\\\\nas01\\finance"
        target: "/mnt/nas-finance"
    enabled: true
    labels: ["nas", "finance"]
    include_extensions: ["pdf", "docx", "xlsx", "pptx", "txt", "csv", "md"]
    exclude_extensions: ["tmp", "bak", "partial"]
    include_file_patterns: []
    exclude_file_patterns:
      - "**/~$*"
      - "*.tmp"
      - "*.bak"
    include_folder_patterns: []
    exclude_folder_patterns:
      - "**/.git/**"
      - "**/node_modules/**"
      - "**/tmp/**"
      - "**/@Recently-Snapshot/**"
      - "**/@Recycle/**"
      - "**/#recycle/**"
      - "**/$RECYCLE.BIN/**"
      - "**/RECYCLER/**"
      - "**/.sync/**"
      - "**/.qsync/**"
      - "**/.qsync_sn/**"
    exclude_patterns: []
    credential_ref: "systemd-user-or-mount-secret"
    content_extraction: true
    ocr: false
    hashing: false
    collect_ownership: true

  - id: "nas-projects"
    path: "/mnt/nas-projects"
    enabled: false
    labels: ["nas", "projects"]
    include_extensions: []
    exclude_extensions: ["tmp", "bak"]
    include_file_patterns: []
    exclude_file_patterns:
      - "**/~$*"
      - "*.tmp"
    include_folder_patterns: []
    exclude_folder_patterns:
      - "**/.git/**"
      - "**/node_modules/**"
    exclude_patterns: []
    credential_ref: "systemd-user-or-mount-secret"

  - id: "mounted-share-top-level"
    path: "/mnt/nas-*/*"
    enabled: false
    labels: ["mounted", "wildcard"]
    include_extensions: ["pdf", "docx", "xlsx", "pptx", "txt", "csv", "md"]
    exclude_extensions: ["tmp", "bak", "partial"]
    include_file_patterns: []
    exclude_file_patterns:
      - "~$*"
      - "*.tmp"
      - "*.bak"
    include_folder_patterns: []
    exclude_folder_patterns:
      - "**/.git/**"
      - "**/node_modules/**"
      - "**/tmp/**"
    exclude_patterns: []
    credential_ref: "systemd-user-or-mount-secret"
